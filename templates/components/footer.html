<!-- Footer Component -->
<footer class="footer">
  <div class="container">
    <div class="row align-items-center gy-3">
      <div class="col-md-6 text-center text-md-start">
        <p class="footer-text mb-0">
          {{ site_settings.footer_text|default:"&copy; All Rights Reserved. Built with Django & Bootstrap 5."|safe }}
        </p>
      </div>
      <div class="col-md-6 text-center text-md-end">
        <div class="d-inline-flex gap-2">
          {% for social in social_links %}
            <a href="{{ social.url }}" target="_blank" rel="noopener noreferrer" class="social-icon-btn" title="{{ social.get_platform_display }}">
              <i class="bi {{ social.icon|default:'bi-link-45deg' }}"></i>
            </a>
          {% endfor %}
          <a href="{% url 'accounts:login' %}" class="social-icon-btn" title="Owner Admin Portal">
            <i class="bi bi-shield-lock"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</footer>
