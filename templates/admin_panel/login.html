<!-- Admin Login -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Portal Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/admin.css' %}">
  <style>
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper input {
      padding-right: 48px !important;
    }
    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 6px 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      line-height: 1;
      border-radius: 6px;
      transition: color 0.2s ease, background-color 0.2s ease;
      z-index: 5;
    }
    .password-toggle-btn:hover {
      color: #1e293b;
      background-color: rgba(0, 0, 0, 0.05);
    }
    .password-toggle-btn:focus {
      outline: none;
      color: #6366f1;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h1 class="login-title">Portfolio CMS</h1>
    <p class="login-subtitle">Sign in to manage your portfolio content</p>

    {% if messages %}
      {% for message in messages %}
        <div class="admin-alert admin-alert-error mb-3">
          <i class="bi bi-exclamation-circle"></i> {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post" class="admin-form">
      {% csrf_token %}
      <div class="admin-form-group mb-3">
        <label class="admin-form-label">Username</label>
        {{ form.username }}
      </div>
      <div class="admin-form-group mb-4">
        <label class="admin-form-label">Password</label>
        <div class="password-wrapper">
          {{ form.password }}
          <button type="button" 
                  id="togglePasswordBtn" 
                  class="password-toggle-btn" 
                  aria-label="Toggle password visibility" 
                  title="Show password">
            <i class="bi bi-eye" id="togglePasswordIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="login-btn">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
      </button>
    </form>
    <div class="text-center mt-4">
      <a href="{% url 'public:home' %}" class="text-secondary small text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i> Return to Public Portfolio
      </a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const passwordInput = document.getElementById('id_password') || document.querySelector('input[name="password"]');
      const toggleIcon = document.getElementById('togglePasswordIcon');

      if (toggleBtn && passwordInput && toggleIcon) {
        toggleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          const currentType = passwordInput.getAttribute('type');
          if (currentType === 'password') {
            passwordInput.setAttribute('type', 'text');
            toggleIcon.classList.remove('bi-eye');
            toggleIcon.classList.add('bi-eye-slash');
            toggleBtn.setAttribute('title', 'Hide password');
            toggleBtn.setAttribute('aria-label', 'Hide password');
          } else {
            passwordInput.setAttribute('type', 'password');
            toggleIcon.classList.remove('bi-eye-slash');
            toggleIcon.classList.add('bi-eye');
            toggleBtn.setAttribute('title', 'Show password');
            toggleBtn.setAttribute('aria-label', 'Show password');
          }
          passwordInput.focus();
        });
      }
    });
  </script>
</body>
</html>
